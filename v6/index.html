<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#0f3d63">
<title>اتوبان — نسخه تست</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0f3d63; --pd:#0a2d49; --pl:#1a5a8a;
  --a:#0d9488; --al:#14b8a6;
  --ok:#16a34a; --w:#d97706; --r:#dc2626;
  --bg:#f5f7fa; --c:#fff; --t:#1e293b; --m:#64748b;
  --b:#e2e8f0; --s:#f1f5f9;
  --sidebar-w:260px; --topbar-h:56px; --bnav-h:64px;
  --shadow-sm:0 1px 3px rgba(15,61,99,.06);
  --shadow-md:0 4px 16px rgba(15,61,99,.08);
  --shadow-lg:0 12px 32px rgba(15,61,99,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.75;min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
a{color:var(--pl);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:16px;width:100%;padding:12px 14px;border:1.5px solid var(--b);border-radius:10px;background:#fff;color:var(--t);transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pl);box-shadow:0 0 0 3px rgba(26,90,138,.12);outline:none}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.88rem;font-weight:600;color:var(--p);margin-bottom:6px}
.required::after{content:" *";color:var(--r)}

/* ═══ LOGIN ═══ */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0a2d49 0%,#0f3d63 50%,#0d9488 100%)}
.login-card{background:#fff;border-radius:20px;padding:32px 26px;width:100%;max-width:460px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.login-logo{text-align:center;font-size:2rem;font-weight:800;color:var(--p);margin-bottom:4px;letter-spacing:1px}
.login-tagline{text-align:center;color:var(--m);font-size:.85rem;margin-bottom:24px}
.login-sec{font-size:.88rem;font-weight:700;color:var(--pl);margin:18px 0 10px}
.login-user{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--b);border-radius:12px;background:#fff;width:100%;text-align:right;margin-bottom:8px;min-height:64px;transition:.15s}
.login-user:hover,.login-user:active{border-color:var(--a);background:#f0fdfa;transform:translateY(-1px)}
.login-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;flex-shrink:0}
.login-info{flex:1;text-align:right}
.login-name{font-weight:700;color:var(--p);font-size:.95rem}
.login-role{font-size:.78rem;color:var(--m);margin-top:2px}
.login-badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0}
.login-badge.buyer{background:#dbeafe;color:#1e40af}
.login-badge.supplier{background:#fef3c7;color:#92400e}

/* ═══ APP SHELL ═══ */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--sidebar-w);max-width:85vw;background:linear-gradient(180deg,var(--pd),var(--p));color:#fff;padding:18px 12px;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:120;overflow-y:auto;box-shadow:-8px 0 32px rgba(0,0,0,.2)}
body.sb-open .sidebar{transform:translateX(0)}
.sb-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.15)}
.sb-brand{font-size:1.3rem;font-weight:800;letter-spacing:1px}
.sb-close{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:.15s;flex-shrink:0}
.sb-close:active{background:rgba(255,255,255,.3)}
.sb-user{background:rgba(255,255,255,.1);border-radius:12px;padding:14px;margin-bottom:16px;text-align:center}
.sb-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--al));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;margin:0 auto 8px}
.sb-uname{font-weight:700;font-size:.92rem}
.sb-uorg{font-size:.75rem;color:#c8ddf0;margin-top:2px}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sb-nav a{color:#d1e5f5;padding:12px 14px;border-radius:10px;font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:10px;text-decoration:none;transition:.15s;min-height:44px}
.sb-nav a:hover,.sb-nav a:active{background:rgba(255,255,255,.1);color:#fff}
.sb-nav a.active{background:var(--a);color:#fff;font-weight:700}
.sb-nav a .ni{font-size:1.1rem;flex-shrink:0}
.sb-nav a .nc{background:rgba(255,255,255,.25);font-size:.7rem;padding:2px 8px;border-radius:999px;margin-right:auto;font-weight:700;min-width:22px;text-align:center}
.sb-foot{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.15)}
.sb-logout{width:100%;padding:12px;background:rgba(220,38,38,.2);color:#fca5a5;border-radius:10px;font-size:.9rem;font-weight:600;transition:.15s;min-height:44px}
.sb-logout:active{background:rgba(220,38,38,.4);color:#fff}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:110}
body.sb-open .backdrop{opacity:1;pointer-events:auto}
.topbar{position:fixed;top:0;right:0;left:0;height:var(--topbar-h);background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;display:flex;align-items:center;padding:0 12px;gap:10px;z-index:50;box-shadow:0 2px 12px rgba(15,61,99,.2)}
.tb-menu{width:40px;height:40px;background:rgba(255,255,255,.15);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:.15s;flex-shrink:0}
.tb-menu:active{background:rgba(255,255,255,.3)}
.tb-title{font-weight:700;font-size:1rem;flex:1}
.tb-user{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--al));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.main{flex:1;padding:16px;padding-top:calc(var(--topbar-h) + 16px);padding-bottom:calc(var(--bnav-h) + 16px);min-width:0;width:100%}
.bnav{position:fixed;bottom:0;right:0;left:0;height:var(--bnav-h);background:#fff;border-top:1px solid var(--b);display:flex;align-items:center;justify-content:space-around;z-index:50;box-shadow:0 -2px 12px rgba(15,61,99,.08);padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0)}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 4px;color:var(--m);text-decoration:none;font-size:.68rem;font-weight:600;min-height:52px;border-radius:10px;transition:.15s;position:relative}
.bnav a:active{background:var(--s)}
.bnav a.active{color:var(--a)}
.bnav a .bi{font-size:1.35rem;line-height:1}
.bnav a .bb{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:var(--r);color:#fff;font-size:.62rem;padding:1px 6px;border-radius:999px;font-weight:700;min-width:18px;text-align:center;margin-left:-16px}

/* ═══ CARDS & COMMON ═══ */
.card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:1px solid var(--b)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--s);flex-wrap:wrap;gap:8px}
.card-h h3{margin:0;color:var(--p);font-size:1rem;font-weight:700}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.page-head h2{color:var(--p);font-size:1.25rem;font-weight:800}
.page-sub{color:var(--m);font-size:.82rem;margin-top:2px}
.breadcrumb{font-size:.78rem;color:var(--m);margin-bottom:6px}
.breadcrumb a{color:var(--pl)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:14px;border-right:4px solid var(--a);box-shadow:var(--shadow-sm)}
.stat.info{border-right-color:var(--pl)}
.stat.warn{border-right-color:var(--w)}
.stat.ok{border-right-color:var(--ok)}
.stat-l{font-size:.75rem;color:var(--m);margin-bottom:4px}
.stat-v{font-size:1.5rem;font-weight:800;color:var(--p);line-height:1}

/* ═══ BUTTONS ═══ */
.btn{padding:12px 18px;border-radius:10px;font-size:.9rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.15s;white-space:nowrap;min-height:44px;text-decoration:none;border:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--p);color:#fff}
.btn-p:active{background:var(--pd)}
.btn-a{background:var(--a);color:#fff}
.btn-a:active{background:#0b7d72}
.btn-o{background:#fff;color:var(--p);border:1.5px solid var(--b)}
.btn-o:active{background:var(--s)}
.btn-r{background:var(--r);color:#fff}
.btn-s{background:var(--ok);color:#fff}
.btn-sm{padding:8px 14px;font-size:.82rem;min-height:36px}
.btn-blk{width:100%}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn-group .btn{flex:1;min-width:120px}

/* ═══ BADGES ═══ */
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-ok{background:#dcfce7;color:#166534}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-gray{background:#e2e8f0;color:#475569}

/* ═══ FORMS ═══ */
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr;gap:14px}
.form-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.form-actions .btn{flex:1;min-width:100px}
.checkbox-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:8px;cursor:pointer;min-height:44px;font-weight:400;margin:0}
.checkbox-row input{width:auto;margin:0;flex-shrink:0}

/* ═══ LISTS ═══ */
.list-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);border:1px solid var(--b);display:block;color:var(--t);transition:.15s;text-decoration:none}
.list-item:active{transform:scale(.99);background:var(--s)}
.li-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.li-title{font-weight:700;color:var(--p);font-size:.95rem;flex:1}
.li-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--m);margin-top:6px}
.li-meta strong{color:var(--t);font-weight:700}
.match-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--b);border-right:4px solid var(--ok)}
.match-card.ineligible{border-right-color:var(--r);opacity:.85}
.match-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.match-name{font-weight:700;color:var(--p);flex:1}
.match-score{font-size:1.3rem;font-weight:800;color:var(--a)}
.match-score small{font-size:.7rem;color:var(--m);font-weight:500}
.match-reasons{list-style:none;padding:0;font-size:.82rem}
.match-reasons li{padding:4px 0;display:flex;gap:6px;align-items:flex-start}
.match-reasons li::before{content:"✓";color:var(--ok);font-weight:700;flex-shrink:0}
.match-reasons li.fail::before{content:"✗";color:var(--r)}
.match-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--b);font-size:.78rem;color:var(--m)}
.match-meta strong{color:var(--t)}

/* ═══ ALERTS ═══ */
.alert{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:14px;border-right:4px solid;line-height:1.7}
.alert-i{background:#eff6ff;border-color:#3b82f6;color:#1e40af}
.alert-w{background:#fef3c7;border-color:var(--w);color:#92400e}
.alert-ok{background:#ecfdf5;border-color:var(--ok);color:#166534}
.alert-r{background:#fef2f2;border-color:var(--r);color:#991b1b}

/* ═══ EMPTY ═══ */
.empty{text-align:center;padding:36px 16px;color:var(--m)}
.empty .em-i{font-size:2.8rem;margin-bottom:10px;opacity:.5}
.empty h3{color:var(--p);margin-bottom:6px;font-size:1rem}
.empty p{font-size:.85rem;margin-bottom:14px}

/* ═══ KV ═══ */
.kv{display:grid;gap:0}
.kv-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--s);font-size:.88rem;gap:12px}
.kv-item:last-child{border-bottom:none}
.kv-item dt{color:var(--m);flex-shrink:0;font-weight:500}
.kv-item dd{color:var(--t);font-weight:600;text-align:left;margin:0}

/* ═══ VERSIONS ═══ */
.versions{list-style:none;padding:0}
.versions li{padding:12px;background:#fff;border:1px solid var(--b);border-radius:10px;margin-bottom:8px;font-size:.85rem}
.versions li.current{border-color:var(--a);background:#f0fdfa}
.v-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.v-num{font-weight:700;color:var(--p)}
.v-meta{font-size:.78rem;color:var(--m);line-height:1.7}

/* ═══ COMPARE ═══ */
.cmp-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--b);margin-bottom:14px;-webkit-overflow-scrolling:touch}
.cmp{width:100%;border-collapse:collapse;background:#fff;font-size:.82rem;min-width:560px}
.cmp th{background:var(--s);color:var(--p);padding:10px;text-align:right;font-weight:700;font-size:.78rem;border-bottom:2px solid var(--b);white-space:nowrap}
.cmp td{padding:10px;border-bottom:1px solid var(--s);vertical-align:middle}
.cmp td:first-child{font-weight:600;color:var(--p);background:#fafbfd;white-space:nowrap}
.cmp tr:last-child td{border-bottom:none}
.cmp .best{background:#dcfce7;font-weight:700;color:#166534}
.cmp tr.total td{background:#fff7ed;font-weight:700}

/* ═══ TOAST ═══ */
#toast-container{position:fixed;top:calc(var(--topbar-h) + 12px);left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:calc(100% - 32px);max-width:400px}
.toast{background:var(--p);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:sd .3s ease;text-align:center}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--r)}
@keyframes sd{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}

/* ═══ DESKTOP ═══ */
@media(min-width:1024px){
  :root{--topbar-h:0px;--bnav-h:0px}
  .topbar{display:none}
  .bnav{display:none}
  .app{flex-direction:row-reverse}
  .sidebar{position:sticky;top:0;height:100vh;transform:translateX(0);width:var(--sidebar-w);max-width:none;box-shadow:none;z-index:10}
  body.sb-collapsed .sidebar{display:none}
  .sb-close{display:none}
  .backdrop{display:none}
  .main{padding:24px 28px;max-width:1100px;margin:0 auto;width:100%}
  .form-row.two{grid-template-columns:1fr 1fr}
  .form-row.three{grid-template-columns:1fr 1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .form-actions .btn{flex:initial}
  .desktop-toggle{display:flex!important}
}
.desktop-toggle{display:none;position:fixed;top:16px;right:16px;z-index:20;width:42px;height:42px;background:var(--p);color:#fff;border-radius:10px;align-items:center;justify-content:center;font-size:1.15rem;box-shadow:var(--shadow-md);transition:.15s}
.desktop-toggle:active{background:var(--pd)}
body.sb-collapsed .desktop-toggle{right:16px}

/* ═══ PRINT ═══ */
@media print{.sidebar,.topbar,.bnav,.backdrop,.desktop-toggle{display:none!important}.main{padding:0}.card{box-shadow:none;border:1px solid #ccc}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<script>
'use strict';
const SK='o2ban_mvp_v3';

// ═══ STORAGE ═══
function getState(){try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r)}catch(e){}const s=seed();save(s);return s}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}

function seed(){
  return {
    currentUserId:null,
    organizations:[
      {id:'org-buyer',name:'بهمن‌خودرو — واحد تأمین',type:'buyer'},
      {id:'org-s1',name:'تأمین‌قطعه الف',type:'supplier'},
      {id:'org-s2',name:'فلزگستر ب',type:'supplier'},
      {id:'org-s3',name:'پارس اتصال',type:'supplier'}
    ],
    users:[
      {id:'u1',name:'آقای رضایی',orgId:'org-buyer',role:'buyer',title:'کارشناس ارشد تأمین'},
      {id:'u2',name:'خانم کریمی',orgId:'org-buyer',role:'buyer',title:'مدیر خرید'},
      {id:'u3',name:'آقای محمدی',orgId:'org-s1',role:'supplier',title:'مدیر فروش'},
      {id:'u4',name:'خانم حسینی',orgId:'org-s2',role:'supplier',title:'کارشناس فروش'},
      {id:'u5',name:'آقای تقوی',orgId:'org-s3',role:'supplier',title:'مدیر فروش'}
    ],
    products:[
      {id:'p1',code:'BST-M8',name:'بست فلزی M8',unit:'عدد',spec:'فولاد ضدزنگ ۳۰۴، گالوانیزه'},
      {id:'p2',code:'BST-M10',name:'بست فلزی M10',unit:'عدد',spec:'فولاد ضدزنگ ۳۰۴، گالوانیزه'},
      {id:'p3',code:'PCH-6G',name:'پیچ خودکار ۶ گوش',unit:'عدد',spec:'فولاد کربنی، آبکاری'},
      {id:'p4',code:'WSH-FR',name:'واشر فنری',unit:'عدد',spec:'فولاد فنری'},
      {id:'p5',code:'BSH-BR',name:'بوش برنجی',unit:'عدد',spec:'برنج، قطر داخلی ۱۰mm'}
    ],
    supplierProducts:[
      {id:'sp1',orgId:'org-s1',productId:'p1',capacity:50000,leadDays:20,unitPrice:11500,payment:'60 روزه',validDays:14},
      {id:'sp2',orgId:'org-s1',productId:'p2',capacity:30000,leadDays:25,unitPrice:14500,payment:'60 روزه',validDays:14},
      {id:'sp3',orgId:'org-s2',productId:'p1',capacity:20000,leadDays:15,unitPrice:11800,payment:'30 روزه',validDays:7},
      {id:'sp4',orgId:'org-s2',productId:'p3',capacity:80000,leadDays:10,unitPrice:7800,payment:'نقدی',validDays:10},
      {id:'sp5',orgId:'org-s3',productId:'p2',capacity:40000,leadDays:30,unitPrice:14000,payment:'45 روزه',validDays:21},
      {id:'sp6',orgId:'org-s3',productId:'p5',capacity:10000,leadDays:18,unitPrice:24000,payment:'30 روزه',validDays:14}
    ],
    requirements:[],matches:[],rfqs:[],invitations:[],offers:[],offerVersions:[],decisions:[],orders:[],auditEvents:[]
  };
}

// ═══ UTILS ═══
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
const esc=s=>s==null?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('fa-IR');
const fmtM=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString('fa-IR')+' ریال';
const fmtD=d=>{if(!d)return '—';try{return new Date(d).toLocaleDateString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit'})}catch(e){return '—'}};
const fmtDT=d=>{if(!d)return '—';try{return new Date(d).toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return '—'}};
const daysFromNow=d=>new Date(Date.now()+d*86400000).toISOString();

function toast(msg,type=''){
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),2800);
}

function audit(s,userId,action,entityType,entityId,details){
  s.auditEvents.push({id:uid('ae'),userId,action,entityType,entityId,details:details||'',at:new Date().toISOString()});
}

function reqStatusBadge(st){
  const m={draft:['badge-gray','پیش‌نویس'],matched:['badge-info','تطبیق انجام شد'],rfq_created:['badge-warn','RFQ ارسال شد'],deciding:['badge-warn','در حال تصمیم'],ordered:['badge-ok','سفارش شد'],closed:['badge-gray','بسته']};
  const [c,l]=m[st]||['badge-gray',st];
  return `<span class="badge ${c}">${l}</span>`;
}

// ═══ ROUTER ═══
window.addEventListener('hashchange',render);

function render(){
  const s=getState();
  closeSidebar();
  document.body.style.overflow='';
  if(!s.currentUserId){renderLogin();return}
  const user=s.users.find(u=>u.id===s.currentUserId);
  if(!user){logout();return}
  const org=s.organizations.find(o=>o.id===user.orgId);
  if(!org){logout();return}
  const hash=location.hash.slice(1)||'dashboard';
  const parts=hash.split('/').filter(Boolean);
  const screen=parts[0];

  if(user.role==='buyer'){
    if(screen==='dashboard')return renderBuyerDashboard(s,user,org);
    if(screen==='requirements'&&parts[1])return renderRequirementDetail(s,user,org,parts[1],parts[2]);
    if(screen==='requirements')return renderRequirementsList(s,user,org);
    if(screen==='new-requirement')return renderNewRequirement(s,user,org);
    if(screen==='rfqs'&&parts[1]&&parts[2]==='compare')return renderCompare(s,user,org,parts[1]);
    if(screen==='rfqs'&&parts[1]&&parts[2]==='create-order')return renderCreateOrder(s,user,org,parts[1]);
    if(screen==='rfqs'&&parts[1])return renderBuyerRFQDetail(s,user,org,parts[1]);
    if(screen==='rfqs')return renderRFQsList(s,user,org);
    if(screen==='orders')return renderOrders(s,user,org);
    return renderBuyerDashboard(s,user,org);
  } else {
    if(screen==='dashboard')return renderSupplierDashboard(s,user,org);
    if(screen==='inbox'&&parts[1])return renderSupplierRFQ(s,user,org,parts[1]);
    if(screen==='inbox')return renderInbox(s,user,org);
    if(screen==='my-offers')return renderMyOffers(s,user,org);
    return renderSupplierDashboard(s,user,org);
  }
}

// ═══ LOGIN ═══

  const orgMap={};s.organizations.forEach(o=>orgMap[o.id]=o);
  const uBtn=u=>{
    const org=orgMap[u.orgId]||{};
    const init=(u.name||'?').split(' ').pop().charAt(0);
    return `<button class="login-user" data-login="${u.id}">
      <div class="login-avatar">${esc(init)}</div>
      <div class="login-info">
        <div class="login-name">${esc(u.name)}</div>
        <div class="login-role">${esc(u.title||'')} · ${esc(org.name||'')}</div>
      </div>
      <span class="login-badge ${u.role}">${u.role==='buyer'?'خریدار':'تأمین‌کننده'}</span>
    </button>`;
  };
  document.getElementById('app').innerHTML=`
    <div class="login-screen">
      <div class="login-card">
        <div class="login-logo">اتوبان</div>
        <div class="login-tagline">شبکه خصوصی همکاری زنجیره تأمین — نسخه تست</div>
        <div class="login-sec">خریدار (واحد تأمین)</div>
        ${buyers.map(uBtn).join('')}
        <div class="login-sec">تأمین‌کننده (واحد فروش)</div>
        ${suppliers.map(uBtn).join('')}
        <div class="alert alert-i" style="margin-top:20px;font-size:.78rem;line-height:1.7">
          <strong>راهنمای تست:</strong> با یک خریدار وارد شوید، نیاز خرید ثبت کنید، RFQ بسازید. سپس خارج شوید و با یک تأمین‌کننده پیشنهاد ثبت کنید. سپس برگردید و تصمیم بگیرید.
        </div>
      </div>

function logout(){
  const s=getState();
  s.currentUserId=null;
  save(s);
  location.hash='';
  renderLogin();
}

function openSidebar(){
  document.body.classList.add('sb-open');
  document.body.style.overflow='hidden';
}
function closeSidebar(){
  document.body.classList.remove('sb-open');
  document.body.style.overflow='';
}

  if(user.role==='buyer'){
    const openReq=s.requirements.filter(r=>r.buyerOrgId===user.orgId&&r.status!=='closed'&&r.status!=='ordered').length;
    const activeRfq=s.rfqs.filter(r=>r.buyerOrgId===user.orgId&&r.status==='open').length;
    const items=[
      {href:'#dashboard',label:'داشبورد',icon:'📊',key:'dashboard'},
      {href:'#requirements',label:'نیازهای خرید',icon:'📋',cnt:openReq,key:'requirements'},

      {href:'#orders',label:'سفارش‌ها',icon:'📦',key:'orders'}

      {href:'#inbox',label:'صندوق استعلام‌ها',icon:'📥',cnt:pending,key:'inbox'},
      {href:'#my-offers',label:'پیشنهادهای من',icon:'📤',key:'my-offers'}

// ═══ MATCHING ═══
function runMatching(s,reqId,userId){
  const req=s.requirements.find(r=>r.id===reqId);
  if(!req)return;
  s.matches=s.matches.filter(m=>m.requirementId!==reqId);
  const sps=s.supplierProducts.filter(sp=>sp.productId===req.productId);
  const prices=sps.map(sp=>sp.unitPrice);
  const minP=prices.length?Math.min(...prices):1;
  sps.forEach(sp=>{
    const reasons=[];let eligible=true;
    if(sp.capacity<req.quantity){
      eligible=false;
      reasons.push({type:'fail',text:`ظرفیت (${fmtN(sp.capacity)}) کمتر از نیاز (${fmtN(req.quantity)})`});
    } else {
      reasons.push({type:'ok',text:`ظرفیت کافی: ${fmtN(sp.capacity)} عدد`});
    }
    if(sp.leadDays>req.maxDeliveryDays){
      eligible=false;
      reasons.push({type:'fail',text:`تحویل ${sp.leadDays} روز بیشتر از مهلت ${req.maxDeliveryDays} روز`});
    } else {
      reasons.push({type:'ok',text:`تحویل ${sp.leadDays} روز — مطابق مهلت`});
    }
    let score=0;
    if(eligible){
      const ps=100*(minP/sp.unitPrice);
      const ls=100*(1-(sp.leadDays/req.maxDeliveryDays)*0.5);
      const cs=100*Math.min(1,(sp.capacity-req.quantity)/req.quantity+0.5);
      score=Math.round(ps*0.5+ls*0.3+cs*0.2);
      reasons.push({type:'ok',text:`قیمت اعلامی: ${fmtM(sp.unitPrice)}`});
      reasons.push({type:'ok',text:`پرداخت: ${esc(sp.payment)}`});
      if(sp.validDays)reasons.push({type:'ok',text:`اعتبار پیشنهاد: ${sp.validDays} روز`});
    }
    s.matches.push({
      id:uid('m'),requirementId:reqId,supplierOrgId:sp.orgId,
      supplierProductId:sp.id,eligible,score,reasons,
      capacity:sp.capacity,leadDays:sp.leadDays,unitPrice:sp.unitPrice,
      payment:sp.payment,validDays:sp.validDays,
      calculatedAt:new Date().toISOString()
    });
  });
  req.status='matched';
  audit(s,userId,'اجرای تطبیق','requirement',reqId,`${sps.length} تأمین‌کننده ارزیابی شد`);
}

// ═══ BUYER — REQUIREMENT DETAIL ═══
function renderRequirementDetail(s,user,org,reqId,sub){
  const req=s.requirements.find(r=>r.id===reqId);
  if(!req||req.buyerOrgId!==org.id){location.hash='#requirements';return}
  if(sub==='create-rfq'){
    const eligible=s.matches.filter(m=>m.requirementId===reqId&&m.eligible);
    return renderCreateRFQForm(s,user,org,req,eligible);
  }
  const p=s.products.find(x=>x.id===req.productId);
  const matches=s.matches.filter(m=>m.requirementId===reqId);
  const eligible=matches.filter(m=>m.eligible).sort((a,b)=>b.score-a.score);
  const ineligible=matches.filter(m=>!m.eligible);
  const orgMap={};s.organizations.forEach(o=>orgMap[o.id]=o);
  const existingRfq=s.rfqs.find(r=>r.requirementId===reqId);
  const matchCard=m=>{
    const sup=orgMap[m.supplierOrgId];
    return `<div class="match-card ${m.eligible?'':'ineligible'}">
      <div class="match-head">
        <div class="match-name">${esc(sup?.name||'—')}</div>
        ${m.eligible?`<div class="match-score">${m.score}<small>/100</small></div>`:`<span class="badge badge-danger">واجد نیست</span>`}
      </div>
      <ul class="match-reasons">${m.reasons.map(r=>`<li class="${r.type==='fail'?'fail':''}">${esc(r.text)}</li>`).join('')}</ul>
      <div class="match-meta">
        <span>ظرفیت: <strong>${fmtN(m.capacity)}</strong></span>
        <span>تحویل: <strong>${m.leadDays} روز</strong></span>
        <span>قیمت: <strong>${fmtM(m.unitPrice)}</strong></span>
      </div>
    </div>`;
  };
  const content=`
    <div class="breadcrumb"><a href="#requirements">نیازهای خرید</a> / جزئیات</div>
    <div class="page-head">
      <div><h2>${esc(req.title)}</h2><div class="page-sub">${esc(p?.name||'—')} · ${fmtD(req.createdAt)}</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>مشخصات نیاز</h3>${reqStatusBadge(req.status)}</div>

// ═══ BUYER — COMPARE ═══
function renderCompare(s,user,org,rfqId){
  const rfq=s.rfqs.find(r=>r.id===rfqId);
  if(!rfq||rfq.buyerOrgId!==org.id){location.hash='#rfqs';return}
  const req=s.requirements.find(r=>r.id===rfq.requirementId);
  const p=s.products.find(x=>x.id===req.productId);
  const offers=s.offers.filter(o=>o.rfqId===rfq.id);
  const orgMap={};s.organizations.forEach(o=>orgMap[o.id]=o);
  const rows=offers.map(o=>{
    const ver=s.offerVersions.filter(v=>v.offerId===o.id).sort((a,b)=>b.versionNumber-a.versionNumber)[0];
    if(!ver)return null;
    const total=ver.unitPrice*ver.quantity;
    const payDays=ver.payment==='نقدی'?0:ver.payment==='30 روزه'?30:ver.payment==='60 روزه'?60:ver.payment==='90 روزه'?90:30;
    const financing=Math.round(total*0.03*(payDays/30));
    return {o,ver,total,financing,totalCost:total+financing,supplier:orgMap[o.supplierOrgId]};
  }).filter(Boolean);
  const minTotal=Math.min(...rows.map(r=>r.totalCost));
  const minPrice=Math.min(...rows.map(r=>r.ver.unitPrice));
  const content=`
    <div class="breadcrumb"><a href="#rfqs/${rfq.id}">RFQ</a> / مقایسه</div>
    <div class="page-head"><div><h2>مقایسه پیشنهادها</h2><div class="page-sub">${esc(rfq.title)}</div></div></div>
    <div class="alert alert-w">
      <strong>توجه:</strong> مقایسه بر اساس «هزینه کل قابل مقایسه» است؛ کمترین قیمت واحد معیار انتخاب نیست.
    </div>
    <div class="cmp-wrap">
      <table class="cmp">
        <thead><tr><th>معیار</th>${rows.map(r=>`<th>${esc(r.supplier.name)}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>قیمت واحد</td>${rows.map(r=>`<td class="${r.ver.unitPrice===minPrice?'best':''}">${fmtM(r.ver.unitPrice)}</td>`).join('')}</tr>
          <tr><td>مقدار</td>${rows.map(r=>`<td>${fmtN(r.ver.quantity)}</td>`).join('')}</tr>
          <tr><td>تحویل</td>${rows.map(r=>`<td>${r.ver.deliveryDays} روز</td>`).join('')}</tr>
          <tr><td>پرداخت</td>${rows.map(r=>`<td>${esc(r.ver.payment)}</td>`).join('')}</tr>
          <tr><td>اعتبار</td>${rows.map(r=>`<td>${fmtD(r.ver.validUntil)}</td>`).join('')}</tr>
          <tr><td>هزینه مالی</td>${rows.map(r=>`<td>${fmtM(r.financing)}</td>`).join('')}</tr>
          <tr class="total"><td>هزینه کل</td>${rows.map(r=>`<td class="${r.totalCost===minTotal?'best':''}">${fmtM(r.totalCost)}</td>`).join('')}</tr>
        </tbody>
      </table>
    </div>
    <form class="card" id="dec-form">
      <div class="card-h"><h3>ثبت تصمیم</h3></div>
      <div class="form-group">
        <label class="required">تأمین‌کننده منتخب</label>
        <select name="supplierId" required>
          <option value="">— انتخاب —</option>
          ${rows.map(r=>`<option value="${r.o.supplierOrgId}">${esc(r.supplier.name)} — ${fmtM(r.totalCost)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="required">دلیل انتخاب</label>
        <textarea name="reason" required placeholder="مثال: بالاترین امتیاز تطبیق، هزینه کل مناسب، ظرفیت کافی"></textarea>
      </div>
      <div class="form-actions">
        <a href="#rfqs/${rfq.id}" class="btn btn-o">انصراف</a>
        <button type="submit" class="btn btn-s">ثبت تصمیم</button>
      </div>
    </form>
  `;
  shell(s,user,org,content,'rfqs');
  document.getElementById('dec-form').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const s2=getState();
    const supplierId=fd.get('supplierId');
    const reason=fd.get('reason').trim();
    if(!supplierId||!reason){toast('همه فیلدها را تکمیل کنید','err');return}
    const r=rows.find(x=>x.o.supplierOrgId===supplierId);
    s2.decisions.push({
      id:uid('dec'),rfqId:rfq.id,selectedSupplierOrgId:supplierId,
      selectedOfferId:r.o.id,selectedVersionId:r.ver.id,
      reason,userId:user.id,at:new Date().toISOString()
    });
    const req2=s2.requirements.find(x=>x.id===rfq.requirementId);
    if(req2)req2.status='deciding';
    audit(s2,user.id,'ثبت تصمیم خرید','rfq',rfq.id,`تأمین‌کننده: ${r.supplier.name}`);
    save(s2);
    toast('تصمیم ثبت شد','ok');
    location.hash='#rfqs/'+rfq.id;
  });
}

  const won=s.decisions.filter(d=>d.selectedSupplierOrgId===org.id).length;
  const content=`
    <div class="page-head"><div><h2>داشبورد تأمین‌کننده</h2><div class="page-sub">${esc(org.name)}</div></div></div>
    <div class="stats">
      <div class="stat info"><div class="stat-l">استعلام‌های در انتظار</div><div class="stat-v">${fmtN(pending.length)}</div></div>
      <div class="stat"><div class="stat-l">پیشنهادهای من</div><div class="stat-v">${fmtN(myOffers.length)}</div></div>
      <div class="stat ok"><div class="stat-l">برنده‌شده</div><div class="stat-v">${fmtN(won)}</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>استعلام‌های در انتظار</h3><a href="#inbox" class="btn btn-o btn-sm">همه</a></div>
      ${pending.length===0?`
        <div class="empty">
          <div class="em-i">📥</div>
          <h3>استعلام جدیدی در انتظار نیست</h3>
          <p>وقتی خریداری شما را دعوت کند، اینجا نمایش داده می‌شود.</p>
        </div>
      `:pending.slice(0,5).map(i=>{
        const rfq=s.rfqs.find(r=>r.id===i.rfqId);
        const req=s.requirements.find(r=>r.id===rfq.requirementId);
        const p=s.products.find(x=>x.id===req.productId);
        return `<a href="#inbox/${rfq.id}" class="list-item">
          <div class="li-head"><div class="li-title">${esc(rfq.title)}</div><span class="badge badge-warn">در انتظار</span></div>
          <div class="li-meta">
            <span>${esc(p?.name||'—')}</span>
            <span>${fmtN(req.quantity)}</span>
            <span>مهلت: <strong>${fmtD(rfq.deadline)}</strong></span>
          </div>
        </a>`;
      }).join('')}
    </div>
  `;
  shell(s,user,org,content,'dashboard');
}

// ═══ SUPPLIER — INBOX ═══
function renderInbox(s,user,org){
  const invs=s.invitations.filter(i=>i.supplierOrgId===org.id).slice().reverse();
  const content=`
    <div class="page-head"><div><h2>صندوق استعلام‌ها</h2><div class="page-sub">RFQهای ارسال‌شده به شما</div></div></div>
    ${invs.length===0?`
      <div class="empty">
        <div class="em-i">📥</div>
        <h3>استعلامی دریافت نشده</h3>
        <p>خریداران هنوز شما را دعوت نکرده‌اند.</p>
      </div>
    `:invs.map(i=>{
      const rfq=s.rfqs.find(r=>r.id===i.rfqId);
      if(!rfq)return '';
      const myOffer=s.offers.find(o=>o.rfqId===rfq.id&&o.supplierOrgId===org.id);
      return `<a href="#inbox/${rfq.id}" class="list-item">
        <div class="li-head">
          <div class="li-title">${esc(rfq.title)}</div>
          ${myOffer?'<span class="badge badge-ok">ارسال شد</span>':'<span class="badge badge-warn">در انتظار</span>'}
        </div>
        <div class="li-meta">
          <span>مهلت: <strong>${fmtD(rfq.deadline)}</strong></span>
          <span>${rfq.status==='open'?'باز':'بسته'}</span>
        </div>
      </a>`;
    }).join('')}
  `;
  shell(s,user,org,content,'inbox');
}

// ═══ SUPPLIER — RFQ DETAIL ═══
function renderSupplierRFQ(s,user,org,rfqId){
  const rfq=s.rfqs.find(r=>r.id===rfqId);
  if(!rfq){location.hash='#inbox';return}
  const inv=s.invitations.find(i=>i.rfqId===rfq.id&&i.supplierOrgId===org.id);
  if(!inv){location.hash='#inbox';return}
  const req=s.requirements.find(r=>r.id===rfq.requirementId);
  const p=s.products.find(x=>x.id===req.productId);
  const existingOffer=s.offers.find(o=>o.rfqId===rfq.id&&o.supplierOrgId===org.id);
  const versions=existingOffer?s.offerVersions.filter(v=>v.offerId===existingOffer.id).sort((a,b)=>a.versionNumber-b.versionNumber):[];
  const latest=versions[versions.length-1];
  const isExpired=new Date(rfq.deadline)<new Date();
  const content=`
    <div class="breadcrumb"><a href="#inbox">صندوق</a> / جزئیات</div>
    <div class="page-head">
      <div><h2>${esc(rfq.title)}</h2><div class="page-sub">مهلت: ${fmtD(rfq.deadline)} ${isExpired?'· پایان یافته':''}</div></div>
    </div>
    <div class="card">
      <div class="card-h"><h3>مشخصات درخواست</h3></div>
      <dl class="kv">
        <div class="kv-item"><dt>محصول</dt><dd>${esc(p?.name||'—')}</dd></div>
        <div class="kv-item"><dt>مقدار</dt><dd>${fmtN(req.quantity)} ${esc(p?.unit||'')}</dd></div>
        <div class="kv-item"><dt>مهلت تحویل</dt><dd>${req.maxDeliveryDays} روز</dd></div>
        <div class="kv-item"><dt>محل تحویل</dt><dd>${esc(req.deliveryLocation||'—')}</dd></div>
        <div class="kv-item"><dt>پرداخت ترجیحی</dt><dd>${esc(req.preferredPayment||'—')}</dd></div>
        <div class="kv-item"><dt>توضیحات</dt><dd>${esc(rfq.notes||'—')}</dd></div>
      </dl>
    </div>
    ${latest?`
      <div class="card" style="border-right:4px solid var(--a)">
        <div class="card-h"><h3>پیشنهاد فعلی شما</h3><span class="badge badge-info">v${latest.versionNumber}</span></div>
        <dl class="kv">
          <div class="kv-item"><dt>قیمت واحد</dt><dd><strong>${fmtM(latest.unitPrice)}</strong></dd></div>
          <div class="kv-item"><dt>مقدار</dt><dd>${fmtN(latest.quantity)}</dd></div>
          <div class="kv-item"><dt>تحویل</dt><dd>${latest.deliveryDays} روز</dd></div>
          <div class="kv-item"><dt>پرداخت</dt><dd>${esc(latest.payment)}</dd></div>
          <div class="kv-item"><dt>اعتبار تا</dt><dd>${fmtD(latest.validUntil)}</dd></div>
        </dl>
      </div>
      <div class="card">
        <div class="card-h"><h3>تاریخچه نسخه‌ها (${versions.length})</h3></div>
        <ul class="versions">
          ${versions.slice().reverse().map(v=>`
            <li class="${v.id===latest.id?'current':''}">
              <div class="v-head">
                <span class="v-num">نسخه v${v.versionNumber}</span>
                ${v.id===latest.id?'<span class="badge badge-ok">فعلی</span>':''}
              </div>
              <div class="v-meta">${fmtM(v.unitPrice)} · تحویل ${v.deliveryDays} روز · ${esc(v.payment)}<br>${fmtDT(v.createdAt)}</div>
            </li>
          `).join('')}
        </ul>
      </div>
    `:''}
    ${!isExpired?`
      <form class="card" id="offer-form">
        <div class="card-h"><h3>${existingOffer?'ثبت نسخه جدید':'ثبت پیشنهاد'}</h3></div>
        <div class="form-row">
          <div class="form-group">
            <label class="required">قیمت واحد (ریال)</label>
            <input name="unitPrice" type="number" min="1" required value="${latest?.unitPrice||''}" placeholder="11500"/>
          </div>
          <div class="form-group">
            <label class="required">مقدار قابل تأمین</label>
            <input name="quantity" type="number" min="1" required value="${latest?.quantity||req.quantity}"/>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="required">زمان تحویل (روز)</label>
            <input name="deliveryDays" type="number" min="1" required value="${latest?.deliveryDays||req.maxDeliveryDays}"/>
          </div>
          <div class="form-group">
            <label class="required">شرایط پرداخت</label>
            <select name="payment" required>
              ${['نقدی','30 روزه','60 روزه','90 روزه'].map(o=>`<option value="${o}" ${latest?.payment===o?'selected':''}>${o}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="required">اعتبار پیشنهاد (روز)</label>
          <input name="validDays" type="number" min="1" required value="7"/>
        </div>
        <div class="form-group">
          <label>توضیحات</label>
          <input name="notes" placeholder="اختیاری"/>
        </div>
        ${existingOffer?`<div class="alert alert-w">با ثبت، نسخه جدید ساخته می‌شود و نسخه فعلی (v${latest.versionNumber}) در تاریخچه حفظ می‌شود.</div>`:''}
        <div class="form-actions">
          <a href="#inbox" class="btn btn-o">انصراف</a>
          <button type="submit" class="btn btn-p">${existingOffer?'ثبت نسخه جدید':'ارسال پیشنهاد'}</button>
        </div>
      </form>
    `:`<div class="alert alert-r">مهلت پاسخ پایان یافته است.</div>`}
  `;
  shell(s,user,org,content,'inbox');
  const form=document.getElementById('offer-form');
  if(form)form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const s2=getState();
    const validUntil=daysFromNow(Number(fd.get('validDays')));
    const now=new Date().toISOString();
    const existing=s2.offers.find(o=>o.rfqId===rfq.id&&o.supplierOrgId===org.id);
    if(existing){
      const vers=s2.offerVersions.filter(v=>v.offerId===existing.id);
      const next=vers.length+1;
      s2.offerVersions.push({
        id:uid('ov'),offerId:existing.id,versionNumber:next,
        unitPrice:Number(fd.get('unitPrice')),quantity:Number(fd.get('quantity')),
        deliveryDays:Number(fd.get('deliveryDays')),payment:fd.get('payment'),
        validUntil,notes:fd.get('notes')||'',createdAt:now,
        createdByUserId:user.id
      });
      existing.status='submitted';
      audit(s2,user.id,'ثبت نسخه جدید پیشنهاد','offer',existing.id,'v'+next);
      toast('نسخه جدید ثبت شد','ok');
    } else {
      const offerId=uid('off');
      s2.offers.push({id:offerId,rfqId:rfq.id,supplierOrgId:org.id,status:'submitted',createdAt:now});
      s2.offerVersions.push({
        id:uid('ov'),offerId,versionNumber:1,
        unitPrice:Number(fd.get('unitPrice')),quantity:Number(fd.get('quantity')),
        deliveryDays:Number(fd.get('deliveryDays')),payment:fd.get('payment'),
        validUntil,notes:fd.get('notes')||'',createdAt:now,
        createdByUserId:user.id
      });
      const inv2=s2.invitations.find(i=>i.rfqId===rfq.id&&i.supplierOrgId===org.id);
      if(inv2)inv2.status='responded';
      audit(s2,user.id,'ثبت پیشنهاد','offer',offerId,`${fmtM(fd.get('unitPrice'))}`);
      toast('پیشنهاد شما ثبت شد','ok');
    }
    save(s2);
    location.hash='#inbox/'+rfq.id;
  });
}

// ═══ SUPPLIER — MY OFFERS ═══
function renderMyOffers(s,user,org){
  const offers=s.offers.filter(o=>o.supplierOrgId===org.id).slice().reverse();
  const content=`
    <div class="page-head"><div><h2>پیشنهادهای من</h2><div class="page-sub">پیشنهادهای ارسال‌شده</div></div></div>
    ${offers.length===0?`
      <div class="empty">
        <div class="em-i">📤</div>
        <h3>هنوز پیشنهادی ثبت نکرده‌اید</h3>
        <p>از صندوق استعلام‌ها یک RFQ انتخاب کنید.</p>
        <a href="#inbox" class="btn btn-p">مشاهده صندوق</a>
      </div>
    `:offers.map(o=>{
      const rfq=s.rfqs.find(r=>r.id===o.rfqId);
      const vers=s.offerVersions.filter(v=>v.offerId===o.id);
      const latest=vers.sort((a,b)=>b.versionNumber-a.versionNumber)[0];
      const won=s.decisions.find(d=>d.rfqId===o.rfqId&&d.selectedSupplierOrgId===org.id);
      return `<a href="#inbox/${rfq.id}" class="list-item">
        <div class="li-head">
          <div class="li-title">${esc(rfq?.title||'—')}</div>
          ${won?'<span class="badge badge-ok">برنده</span>':rfq?.status==='closed'?'<span class="badge badge-gray">بسته</span>':'<span class="badge badge-warn">در انتظار</span>'}
        </div>
        <div class="li-meta">
          <span>نسخه: <strong>v${latest?.versionNumber||'?'}</strong></span>
          <span>قیمت: <strong>${fmtM(latest?.unitPrice)}</strong></span>
        </div>
      </a>`;
    }).join('')}
  `;
  shell(s,user,org,content,'my-offers');
}

// ═══ INIT ═══
if(!location.hash)location.hash='';
render();
</script>
</body>
